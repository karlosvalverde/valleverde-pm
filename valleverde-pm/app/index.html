<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valleverde PM</title>
<meta name="description" content="Valleverde PM: a personal project-management cockpit that works with your Odoo database.">
<!-- Offline by design: the browser blocks every network request this page could make. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<style>
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/hanken-grotesk-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/source-serif-4-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/source-serif-4-latin-400-italic.woff2) format("woff2")}
:root{
  --paper:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#18232E; --muted:#5B6875; --faint:#8A96A2;
  --line:#D6DCE2; --line-strong:#B9C2CC;
  --accent:#0D6A6A; --accent-hover:#0A5656; --on-accent:#FFFFFF; --accent-soft:#D5EAE8;
  --mark:#F6D55C; --mark-ink:#18232E;
  --danger:#B3261E; --danger-soft:#F8E1DF; --ok:#2C7A4B; --ok-soft:#DDEFE3; --warn:#94580A; --warn-soft:#F8EAD2;
  --violet:#6A4BA6; --violet-soft:#ECE5F6;
  --sans:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r-sm:6px; --r:10px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161B; --surface:#182027; --surface-2:#1E262F; --ink:#E3E8ED; --muted:#9AA6B2; --faint:#6F7B87;
    --line:#2A333D; --line-strong:#3A4552;
    --accent:#4DB2AE; --accent-hover:#6CC4C0; --on-accent:#0B1A1A; --accent-soft:#163636;
    --mark:#C9A535; --mark-ink:#11161B;
    --danger:#F08A80; --danger-soft:#3A1E1C; --ok:#7CCB98; --ok-soft:#173225; --warn:#E5B45A; --warn-soft:#3A2C12;
    --violet:#B9A0E8; --violet-soft:#2A2340;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161B; --surface:#182027; --surface-2:#1E262F; --ink:#E3E8ED; --muted:#9AA6B2; --faint:#6F7B87;
  --line:#2A333D; --line-strong:#3A4552;
  --accent:#4DB2AE; --accent-hover:#6CC4C0; --on-accent:#0B1A1A; --accent-soft:#163636;
  --mark:#C9A535; --mark-ink:#11161B;
  --danger:#F08A80; --danger-soft:#3A1E1C; --ok:#7CCB98; --ok-soft:#173225; --warn:#E5B45A; --warn-soft:#3A2C12;
  --violet:#B9A0E8; --violet-soft:#2A2340;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}

/* shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;background:var(--paper)}
.brand{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.01em;padding:0 10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand-pm{font-family:var(--sans);font-weight:700;font-size:.62em;letter-spacing:.04em;color:var(--accent);vertical-align:.18em}
.version{padding:0 10px;margin:6px 0 0;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);font-weight:600}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.save-status{margin-top:auto;padding:0 10px;font-size:12.5px;color:var(--faint);line-height:1.4}
.save-status .version{padding:0}
main{padding:36px 44px 90px;max-width:1200px;width:100%}
.loading{padding:80px 0;color:var(--muted);font-size:17px}

/* common */
.view-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;margin-bottom:22px}
.view-head h1{font-size:30px;font-weight:700;letter-spacing:-.018em}
.view-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1 var(--sans);padding:9px 14px;min-height:38px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.small{min-height:32px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2);border-color:var(--line)}
.icon-btn svg{width:17px;height:17px}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input[type="checkbox"],input[type="radio"]{width:18px;height:18px;min-height:0;accent-color:var(--accent);margin:0;flex:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field > input,.field > select,.field > textarea{font-weight:400;font-size:15px;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.hint{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 14px}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.panel-head h2{font-size:17px;font-weight:700}
.panel-head .meta{color:var(--muted);font-size:13px}
.panel-head a,.panel-head .link{margin-left:auto;font-size:13.5px;font-weight:600;text-decoration:none;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--pc);flex:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.k-deadline,.tag.t-issue{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.k-milestone,.tag.t-decision{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.k-delivery,.tag.t-risk{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.t-change,.tag.k-visit{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.list{list-style:none;margin:0;padding:0}
.list > li + li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 6px 10px 14px;background:none;border:0;cursor:pointer;position:relative;border-radius:4px}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--pc,var(--line-strong))}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-side{display:flex;align-items:center;gap:8px;flex:none}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:10px 0 8px;color:var(--muted)}
.empty p{margin:0 0 12px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over > span{background:var(--warn)}
.navbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navbar .label{font-weight:700;font-size:17px;padding:0 6px;min-width:0}

/* highlighter: the one bold mark */
.mark{background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-size:100% 38%;background-position:0 88%;padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mark.sweep{background-size:0% 38%;animation:sweep .75s .2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes sweep{to{background-size:100% 38%}}

/* today */
.hero{margin:4px 0 26px}
.hero-greet{margin:0 0 6px;color:var(--muted);font-size:16px}
.hero-date{font-size:clamp(34px,5.4vw,58px);line-height:1.04;margin:0 0 16px;letter-spacing:-.028em;font-weight:700}
.hero-sum{font-family:var(--serif);font-size:19px;line-height:1.6;max-width:64ch;margin:0 0 18px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.welcome{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:18px 20px;margin-bottom:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.welcome p{margin:0;flex:1;min-width:240px}
.timer{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px}
.timer.running{grid-template-columns:minmax(0,1fr) auto auto;border-left:4px solid var(--pc);padding:14px 16px;gap:18px}
.timer-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.timer-info strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.total-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:4px;font-size:14px;color:var(--muted)}

/* mail */
.mail{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.tpl-list{position:sticky;top:20px;display:flex;flex-direction:column;gap:10px}
.tpl-list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 200px);overflow:auto}
.tpl-item{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tpl-item:hover{background:var(--surface-2)}
.tpl-item[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.tpl-item b{font-weight:600}
.tpl-sub{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.lc{font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;color:var(--muted)}
.lc.off{opacity:.35;border-style:dashed}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.composer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.composer-head h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 13px;font:600 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.4;cursor:default}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .wide{grid-column:1 / -1}
.preview{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:18px 20px}
.mp-subject{font-weight:700;font-size:16px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-wrap:anywhere}
.mp-body{font-family:var(--serif);font-size:16.5px;line-height:1.62;white-space:pre-wrap;max-width:72ch;overflow-wrap:anywhere}
mark.ph{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 3px;font-family:var(--sans);font-size:.84em;font-weight:600}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.missing{font-size:13px;color:var(--warn);font-weight:600}
.ai{border-top:1px solid var(--line);padding-top:16px}
.ai summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
.ai summary::-webkit-details-marker{display:none}
.ai summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.ai[open] summary::before{transform:rotate(45deg)}
.ai-inner{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ai-result{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--accent);padding-left:14px}
.ai-result textarea{font-family:var(--serif);font-size:16px;line-height:1.6}

/* template suggestions */
.sug-entry{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:transparent;cursor:pointer;font-weight:600;color:var(--accent)}
.sug-entry:hover,.sug-entry[aria-current="true"]{background:var(--surface);border-style:solid;border-color:var(--accent)}
.sug-entry svg{width:16px;height:16px;flex:none}
.sug-sec{display:flex;flex-direction:column;gap:12px}
.sug-sec + .sug-sec{border-top:1px solid var(--line);padding-top:18px}
.sug-sec h3{font-size:16px;font-weight:700}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kind{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;min-width:0}
.kind b{font-weight:600;font-size:14px}
.kind small{font-size:12.5px;color:var(--muted);line-height:1.35}
.kind:hover{border-color:var(--ink)}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.kind[aria-pressed="true"] b{color:var(--accent)}
.opts{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-end}
.ideas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.idea{border:1px solid var(--line);border-left:3px solid var(--pc,var(--accent));border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);min-width:0}
.idea-top{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.idea b{font-weight:600;line-height:1.35}
.idea p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.idea .btn-row{margin-top:auto;padding-top:4px}
.tag.u-today{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.tag.u-week{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.draft{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2);scroll-margin-top:calc(20px + env(safe-area-inset-top,0px))}
.draft-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.draft-head h3{font-size:18px;font-weight:700;margin-right:auto}
.draft .preview{background:var(--surface)}
.ph-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.busy-note{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.cal-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{padding:8px 10px;font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cal-cell{min-height:106px;padding:6px 7px 8px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2);color:var(--faint)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cal-num{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cal-hrs{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ev{display:block;font-size:12px;line-height:1.35;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--pc) 15%,var(--surface));border-left:3px solid var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal-more{font-size:11.5px;color:var(--muted);padding-left:4px}
.day-panel{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
.day-panel h2{font-size:19px;letter-spacing:-.01em}

/* goals */
.week-summary{display:flex;align-items:center;gap:16px;margin:4px 0 18px;flex-wrap:wrap}
.week-summary .meter{flex:1;min-width:160px;max-width:360px}
.inline-add{display:grid;grid-template-columns:minmax(0,1fr) 200px auto;gap:8px;margin-bottom:6px}
.goals{list-style:none;margin:0;padding:0}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) 140px auto;gap:12px;align-items:start;padding:13px 2px;border-bottom:1px solid var(--line)}
.goal input[type="checkbox"]{margin-top:3px}
.goal-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.goal-text{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.goal-notes{font-family:var(--serif);color:var(--muted);font-size:15px;white-space:pre-wrap}
.goal-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.goal.s-done .goal-text{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.goal select{min-height:32px;padding:4px 8px;font-size:13.5px}
.goal.s-blocked select{color:var(--danger);border-color:var(--danger)}
.goal.s-doing select{color:var(--accent);border-color:var(--accent)}
.week-notes{margin-top:26px}
.week-notes textarea{font-family:var(--serif);font-size:16px;line-height:1.6}

/* timesheet */
.ts-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start;margin-bottom:24px}
.day-total{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-total .big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ts-form{display:flex;flex-direction:column;gap:10px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.week{border-collapse:collapse;width:100%;min-width:680px;font-variant-numeric:tabular-nums}
table.week th,table.week td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;white-space:nowrap}
table.week th:first-child,table.week td:first-child{text-align:left}
table.week thead th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.week thead button{background:none;border:0;cursor:pointer;font:inherit;color:inherit;padding:2px 4px;border-radius:4px}
table.week thead button:hover{color:var(--ink)}
table.week .is-sel{background:color-mix(in srgb,var(--mark) 22%,transparent)}
table.week tfoot td{font-weight:700;border-bottom:0}
table.week td.zero{color:var(--faint)}

/* diary */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.filters select{width:auto;min-width:170px}
.filters input[type="search"]{width:auto;flex:1;min-width:180px;max-width:340px}
.day-head{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:30px 0 4px;font-weight:400}
.entry{position:relative;padding:16px 0 18px 20px;border-bottom:1px solid var(--line)}
.entry::before{content:"";position:absolute;left:0;top:18px;bottom:20px;width:3px;border-radius:2px;background:var(--pc,var(--line-strong))}
.entry-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entry-top .icon-btn{margin-left:auto}
.entry h3{font-size:17px;font-weight:700;margin:8px 0 6px;overflow-wrap:anywhere}
.entry-body{font-family:var(--serif);font-size:16.5px;line-height:1.62;white-space:pre-wrap;max-width:72ch;overflow-wrap:anywhere}
.status{font:600 12px var(--sans);border-radius:999px;padding:3px 9px;cursor:pointer;border:1px solid currentColor;background:transparent}
.status.open{color:var(--danger)}
.status.closed{color:var(--ok)}
.follow{font-size:13.5px;color:var(--warn);font-weight:600;margin:8px 0 0}

/* projects */
.proj-list{display:flex;flex-direction:column}
.proj{display:grid;grid-template-columns:14px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.proj .sw{width:14px;height:14px;border-radius:3px;background:var(--pc)}
.proj b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj.archived{opacity:.6}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{position:relative;cursor:pointer}
.swatch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.swatch span[aria-hidden]{display:block;width:30px;height:30px;border-radius:6px}
.swatch input:checked + span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swatch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:4px}
.settings{margin-top:34px;max-width:720px}
.settings form{display:flex;flex-direction:column;gap:14px;margin-top:12px}

/* dialog */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog.wide{width:min(940px,calc(100vw - 24px))}
dialog[open]{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
dialog::backdrop{background:rgba(14,20,26,.5)}
#dlgForm{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 6px 22px}
.dlg-head h2{font-size:19px;letter-spacing:-.01em}
.dlg-content{padding:10px 22px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.dlg-foot{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);align-items:center}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lang-block{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.lang-block legend{font-weight:700;padding:0 6px;font-size:14px}
.lang-block textarea{font-family:var(--serif);font-size:15.5px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1020px){
  .cal-layout{grid-template-columns:1fr}
  .day-panel{position:static}
  .ts-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{font-size:20px;padding:0 4px}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;flex:1}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a svg{display:none}
  .nav a[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
  .save-status{display:none}
  main{padding:22px 16px 70px}
  .cols,.mail,.lang-grid,.fields{grid-template-columns:1fr}
  .tpl-list{position:static}
  .tpl-list ul{max-height:240px}
  .timer,.timer.running{grid-template-columns:1fr}
  .inline-add{grid-template-columns:1fr}
  .goal{grid-template-columns:auto minmax(0,1fr) auto;}
  .goal select{grid-column:2;width:auto;justify-self:start}
  .goal .icon-btn{grid-row:1;grid-column:3}
  .proj{grid-template-columns:14px minmax(0,1fr) auto}
  .proj .hide-sm{display:none}
  .composer{padding:18px 16px}
  .cal-cell{min-height:62px;padding:4px 5px}
  .cal-evs{flex-direction:row;flex-wrap:wrap;gap:3px}
  .cal-ev{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--pc);font-size:0}
  .cal-hrs,.cal-more{display:none}
  .cal-dow{padding:6px 4px;text-align:center}
  .f3{grid-template-columns:1fr 1fr}
  .f3 > :first-child{grid-column:1 / -1}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .mark.sweep{background-size:100% 38%}
}
</style>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const todayYmd=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const mondayOf=s=>{const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const isoWeek=s=>{const d=parseYmd(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return{year:t.getUTCFullYear(),week:Math.ceil(((t-y0)/864e5+1)/7)};};
const fmt=(s,o,loc='en-GB')=>parseYmd(s).toLocaleDateString(loc,o);
const fmtLong=s=>fmt(s,{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>fmt(s,{weekday:'short',day:'numeric',month:'short'});
const fmtHM=h=>{const m=Math.round((+h||0)*60);return`${Math.floor(m/60)}:${pad(m%60)}`;};
const round2=n=>Math.round(n*100)/100;
function parseHours(v){
  v=String(v||'').trim().toLowerCase().replace(',','.');
  if(!v)return NaN;
  let m=v.match(/^(\d+):(\d{1,2})$/); if(m)return +m[1]+(+m[2])/60;
  m=v.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m(?:in)?)?$/); if(m&&(m[1]||m[2]))return(+m[1]||0)+(+m[2]||0)/60;
  return parseFloat(v);
}
function weekRange(mon){
  const sun=addDays(mon,6),a=parseYmd(mon),b=parseYmd(sun);
  if(a.getMonth()===b.getMonth())return`${a.getDate()}–${b.getDate()} ${fmt(sun,{month:'long',year:'numeric'})}`;
  return`${fmt(mon,{day:'numeric',month:'long'})} – ${fmt(sun,{day:'numeric',month:'long',year:'numeric'})}`;
}
const byWhen=(a,b)=>(a.date+(a.start||'99')).localeCompare(b.date+(b.start||'99'));
const byCreated=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
const L={en:'English',es:'Spanish'};
const opts=(map,sel)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');
const ICON={
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800);}
async function copyText(text,msg='Copied'){
  try{await navigator.clipboard.writeText(text);toast(msg);}
  catch{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch{}ta.remove();toast(ok?msg:'Couldn’t copy. Select the text and copy it manually.');}
}

/* ---------- configuration ---------- */
const APP_VERSION='0.1.0';
/* ---------- constants ---------- */
const COLLS=['projects','templates','events','goals','weeks','time','log','meta'];
const COLORS=['#0D6A6A','#3B5BA9','#7A4BB8','#C2185B','#D9822B','#5E8C2A','#8A5D3B','#546E7A'];
const KINDS={meeting:'Meeting',milestone:'Milestone',deadline:'Deadline',delivery:'Delivery',visit:'Site visit',other:'Other'};
const STATUSES={todo:'To do',doing:'In progress',done:'Done',blocked:'Blocked'};
const TYPES={note:'Note',decision:'Decision',meeting:'Meeting',issue:'Issue',risk:'Risk',change:'Change request',email:'Email'};
const TRACKED=['issue','risk','change'];
const AUTO=['project','project_code','client','contact','date','week','my_name','signature'];
const PH=/\{\{\s*([\w.-]+)\s*\}\}/g;
const EMAIL_KINDS={
  kickoff:{label:'Kick-off',desc:'Start of a project or phase',brief:'Announce the start of the project or a new phase: its purpose, the team and roles, the first meeting, the timeline, and what you need from the client to get going.',kw:['kick','arranque','inicio']},
  followup:{label:'Follow-up',desc:'After a meeting or no reply',brief:'Follow up after a meeting, a call or an email that got no reply: recap the key points, restate what is pending and who owns it, and propose the next step.',kw:['follow','seguimiento']},
  headsup:{label:'Heads-up',desc:'Advance notice of what’s coming',brief:'Give advance notice of something coming that affects the client: what is happening, when, the impact on them, and whether they need to do anything.',kw:['heads','aviso','notice']},
  wrapup:{label:'Wrap-up',desc:'Close a project or phase',brief:'Close the project or a phase: what was delivered, any open items and who owns them, handover or support arrangements, thanks, and an invitation to give feedback.',kw:['wrap','cierre','closing','closure']},
  status:{label:'Status update',desc:'Progress, next steps, risks',brief:'Report progress: what was done, what comes next, risks or blockers, and anything needed from the client.',kw:['status','estado','report','informe']},
  reminder:{label:'Reminder',desc:'A pending action or deadline',brief:'Politely remind the client of a pending action or an approaching deadline, what depends on it, and the date it is needed by.',kw:['remind','recordatorio']},
  delay:{label:'Delay notice',desc:'A date has to move',brief:'Explain that a date has to move: what is affected, the reason in one line, the new date, and what is being done to limit the impact.',kw:['delay','retraso']},
  change:{label:'Change request',desc:'Scope, cost or time',brief:'Propose a change to scope, cost or schedule: what changes, why, the impact on time and budget, and the approval needed and by when.',kw:['change','cambio']},
  inputs:{label:'Request for input',desc:'Info, files or approval',brief:'Ask the client for information, files, access or an approval you need, with a clear deadline and why it matters for the schedule.',kw:['request','solicitud','input','approval']},
  meeting:{label:'Meeting request',desc:'Propose a meeting',brief:'Propose a meeting: its purpose, two or three possible times, duration, attendees, and a short agenda.',kw:['meeting request','convocatoria','invitation']},
  escalation:{label:'Escalation',desc:'A blocker needs a decision',brief:'Escalate a blocker to someone who can decide: the issue, its impact, the options considered, your recommendation, and the decision needed by when.',kw:['escalat']},
  thanks:{label:'Thank you',desc:'Recognise help or a milestone',brief:'Thank the client or team for their help or for reaching a milestone, being specific about what they did and what it made possible.',kw:['thank','gracias','agradec']}
};
const TONES={friendly:'Friendly',neutral:'Neutral',formal:'Formal'};
const LENGTHS={short:'Short',standard:'Standard',detailed:'Detailed'};
const WHEN={today:['Today','u-today'],this_week:['This week','u-week'],soon:['Soon','']};
const SPARK='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.45 4.7 2.5 7.1 7.5 9.5-5 2.4-7.05 4.8-7.5 9.5-.45-4.7-2.5-7.1-7.5-9.5 5-2.4 7.05-4.8 7.5-9.5Z"/></svg>';

/* ---------- data store ---------- */
const D=Object.fromEntries(COLLS.map(c=>[c,[]]));
const LS='valleverde-pm-v1';
const Store={
  mode:'loading',ready:false,
  async init(){
    try{const o=JSON.parse(localStorage.getItem(LS)||'{}');for(const c of COLLS)D[c]=Array.isArray(o[c])?o[c]:[];}catch{}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch{}
    this.mode='local';this.ready=true;scheduleRender();
  },
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify(D));}catch{toast('Couldn’t save in this browser. Storage may be full: download a backup and remove old entries.');}},
  async put(c,obj){
    obj={...obj};
    if(!obj.id)obj.id=newId();
    obj.updatedAt=Date.now();
    const i=D[c].findIndex(x=>x.id===obj.id);
    if(i>=0)D[c][i]=obj;else D[c].push(obj);
    this.saveLocal();scheduleRender();
    return obj;
  },
  async remove(c,id){D[c]=D[c].filter(x=>x.id!==id);this.saveLocal();scheduleRender();}
};
/* ---------- capabilities ---------- */
// v0.1 is a personal, offline tool: no Odoo connection and no Claude features.
// Both are planned as opt-in features for later versions (see CHANGELOG.md).
const caps={
  sample:null,
  downloads:{save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}}
};

  const keep={};
  $$('[data-keep]',main).forEach(el=>{keep[el.id]=el.type==='checkbox'?el.checked:el.value;});
  const a=document.activeElement;const fid=a&&main.contains(a)?a.id:null;let ss=null,se=null;

const placeholders=s=>{const out=[];String(s).replace(PH,(m,n)=>{if(!out.includes(n))out.push(n);return m;});return out;};

function mailValues(){const v=autoValues(ui.mail.lang);for(const[k,x]of Object.entries(ui.mail.fields))if(x&&x.trim())v[k]=x;return v;}

function fillHtml(s,v){
  s=String(s||'');let out='',last=0;
  s.replace(PH,(all,n,off)=>{out+=esc(s.slice(last,off))+(v[n]?esc(v[n]):`<mark class="ph">${esc(all)}</mark>`);last=off+all.length;return all;});
  return out+esc(s.slice(last));
}

/* ---------- DIARY ---------- */
function diaryFiltered(){
  const f=ui.diary,q=f.q.trim().toLowerCase();
  return D.log.filter(l=>(!f.proj||l.projectId===f.proj)&&(!f.type||l.type===f.type)&&(!f.open||(TRACKED.includes(l.type)&&l.status!=='closed'))&&(!q||`${l.title} ${l.body}`.toLowerCase().includes(q)))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
}
function vDiary(){
  const f=ui.diary,list=diaryFiltered(),groups=[];
  list.forEach(l=>{const g=groups[groups.length-1];if(g&&g.date===l.date)g.items.push(l);else groups.push({date:l.date,items:[l]});});
  return`<header class="view-head"><h1>Diary</h1><div class="actions"><button class="btn" data-act="diary-export"${list.length?'':' disabled'}>Export</button><button class="btn primary" data-act="log-new">New entry</button></div></header>
  <div class="filters">
    <label class="sr" for="dProj">Project</label><select id="dProj" data-change="diary-f" data-k="proj">${projOptions(f.proj,'All projects')}</select>
    <label class="sr" for="dType">Type</label><select id="dType" data-change="diary-f" data-k="type"><option value="">All types</option>${opts(TYPES,f.type)}</select>
    <label class="sr" for="dQ">Search</label><input id="dQ" type="search" placeholder="Search entries" value="${esc(f.q)}" data-input="diary-q">
    <label class="check"><input type="checkbox" data-change="diary-f" data-k="open"${f.open?' checked':''}> Open issues, risks and changes only</label>
  </div>
  ${!D.log.length?`<div class="panel" style="margin-top:18px;max-width:640px">${empty('Your project diary is empty. Log decisions, issues, risks and meeting notes as they happen so you always have the history.','Write the first entry','log-new')}</div>`
   :!list.length?'<p class="hint" style="margin-top:20px">No entries match these filters.</p>'
   :groups.map(g=>`<h2 class="day-head">${esc(fmt(g.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</h2>${g.items.map(entryHtml).join('')}`).join('')}`;
}
function entryHtml(l){
  const tracked=TRACKED.includes(l.type),closed=l.status==='closed';
  return`<article class="entry" style="--pc:${esc(pColor(l.projectId))}">
    <div class="entry-top"><span class="tag t-${esc(l.type)}">${esc(TYPES[l.type]||'Note')}</span>
      ${tracked?`<button class="status ${closed?'closed':'open'}" data-act="log-status" data-id="${esc(l.id)}" aria-label="${closed?'Closed. Reopen':'Open. Mark closed'}">${closed?'Closed':'Open'}</button>`:''}
      ${pill(l.projectId)}
      <button class="icon-btn" data-act="log-edit" data-id="${esc(l.id)}" aria-label="Edit entry">${ICON.edit}</button></div>
    <h3>${esc(l.title||'Untitled')}</h3>
    ${l.body?`<div class="entry-body">${esc(l.body)}</div>`:''}
    ${l.followUp&&!closed?`<p class="follow">Follow up by ${esc(fmtLong(l.followUp))}</p>`:''}
  </article>`;
}

  'week-next':()=>{ui.week=addDays(ui.week,7);render();},
  'week-now':()=>{ui.week=mondayOf(todayYmd());render();},
  'week-save':async()=>{const wk=ui.week;await Store.put('weeks',{id:wk,notes:ui.weekDraft[wk]??''});delete ui.weekDraft[wk];toast('Week notes saved');},
  'time-new':el=>timeDialog(null,el.dataset.d),
  'time-edit':el=>timeDialog(findIn('time',el.dataset.id)),
  'timer-stop':async el=>{
    const t=findIn('time',el.dataset.id);if(!t)return;
    const h=Math.max(0.01,round2((Date.now()-t.startedAt)/36e5));
    await Store.put('time',{...t,running:false,hours:h});toast(`Logged ${fmtHM(h)}${t.projectId?' to '+pName(t.projectId):''}`);
  },
  'ts-prev':()=>{ui.tsDay=addDays(ui.tsDay,-1);render();},
  'ts-next':()=>{ui.tsDay=addDays(ui.tsDay,1);render();},
  'ts-now':()=>{ui.tsDay=todayYmd();render();},
  'ts-go':(el,e)=>{e.preventDefault();ui.tsDay=el.dataset.d;if(location.hash!=='#timesheet')location.hash='timesheet';else render();},
  'ts-export':()=>{
    const mon=mondayOf(ui.tsDay),sun=addDays(mon,6);
    const rows=D.time.filter(x=>x.date>=mon&&x.date<=sun&&!x.running).sort((a,b)=>a.date.localeCompare(b.date)||byCreated(a,b));
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    // Column names match Odoo's timesheet fields, so Odoo's import screen maps them automatically.
    const csv=['date,project_id,task_id,name,unit_amount'].concat(rows.map(x=>{const p=proj(x.projectId)||{};return[x.date,p.name||'',x.task||'',x.description||x.task||'/',(+x.hours||0).toFixed(2)].map(q).join(',');})).join('\r\n');
    saveFile(`timesheet-week-${isoWeek(mon).week}-${isoWeek(mon).year}.csv`,csv);toast('CSV downloaded. Import it in Odoo from Timesheets, then Import records.');
  },
  'log-new':()=>logDialog(),
  'log-edit':el=>logDialog(findIn('log',el.dataset.id)),
  'log-status':async el=>{const l=findIn('log',el.dataset.id);if(l)await Store.put('log',{...l,status:l.status==='closed'?'open':'closed'});},
  'diary-export':()=>{
    const list=diaryFiltered().slice().reverse();let md='# Project diary\n',last='';
    list.forEach(l=>{if(l.date!==last){md+=`\n## ${fmt(l.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\n`;last=l.date;}
      md+=`\n### ${TYPES[l.type]||'Note'}: ${l.title}${l.projectId?` (${pName(l.projectId)})`:''}${TRACKED.includes(l.type)?` [${l.status==='closed'?'Closed':'Open'}]`:''}\n\n${l.body||''}\n`;});
    saveFile(`diary-${todayYmd()}.md`,md,'Diary copied to the clipboard as Markdown.');
  },
  'cal-prev':()=>{const d=parseYmd(ui.cal.month+'-01');d.setMonth(d.getMonth()-1);ui.cal.month=ymd(d).slice(0,7);render();},
  'cal-next':()=>{const d=parseYmd(ui.cal.month+'-01');d.setMonth(d.getMonth()+1);ui.cal.month=ymd(d).slice(0,7);render();},
  'cal-now':()=>{ui.cal.month=todayYmd().slice(0,7);ui.cal.sel=todayYmd();render();},
  'cal-sel':el=>{ui.cal.sel=el.dataset.d;if(el.dataset.d.slice(0,7)!==ui.cal.month)ui.cal.month=el.dataset.d.slice(0,7);render();},
  'tpl-new':()=>tplDialog(),
  'tpl-edit':el=>tplDialog(findIn('templates',el.dataset.id)),
  'tpl-pick':el=>{ui.mail.mode='compose';if(ui.mail.tplId!==el.dataset.id){ui.mail.tplId=el.dataset.id;ui.mail.lang=null;ui.mail.fields={};ui.mail.ai=null;}render();},
  'tpl-seed':async()=>{for(const x of EXAMPLES)await Store.put('templates',{...JSON.parse(JSON.stringify(x)),createdAt:Date.now()});toast('Example templates added');},
  'tpl-translate':async el=>{
    const f=$('#dlgForm'),from=el.dataset.from,to=el.dataset.to;
    const subj=f.elements[from+'_subject'].value,body=f.elements[from+'_body'].value;
    if(!(subj+body).trim()){toast(`Write the ${L[from]} version first.`);return;}
    const old=el.textContent;el.disabled=true;el.textContent='Translating…';
    try{
      const r=await caps.sample.json(`Translate this business email template from ${L[from]} to ${to==='es'?'Spanish (Spain)':'English'}.\n\nRules:\n- Keep every {{placeholder}} exactly as written, untranslated, and put it where it belongs grammatically.\n- Keep the line breaks and the overall structure.\n- Match the formality of the original (in Spanish, use tú for a friendly tone and usted for a formal one).\n- Use natural, professional phrasing a native speaker would use in a work email.\n\nReply with only a JSON object like {"subject": "...", "body": "..."}.\n\nSubject:\n${subj}\n\nBody:\n${body}`);
      if(!r||typeof r.body!=='string')throw{code:'invalid_json'};
      f.elements[to+'_subject'].value=String(r.subject||'');f.elements[to+'_body'].value=r.body;
      toast('Translation added. Review it, then save.');
    }catch(e){toast(aiErr(e));}
    finally{el.disabled=false;el.textContent=old;}
  },
  'mail-lang':el=>{ui.mail.lang=el.dataset.lang;ui.mail.ai=null;render();},
  'mail-copy':el=>{const m=filledMail();copyText(el.dataset.what==='subject'?m.subject:`Subject: ${m.subject}\n\n${m.body}`,el.dataset.what==='subject'?'Subject copied':'Email copied');},
  'mail-clear':()=>{ui.mail.fields={};render();},
  'mail-log':()=>{const m=filledMail();logDialog(null,{type:'email',projectId:ui.mail.projectId,title:m.subject||curTpl().name,body:`To: ${ui.mail.to||'(not set)'}\n\n${m.body}`});},
  'ai-draft':async()=>{
    const m=ui.mail,t=curTpl();
    if(!m.incoming.trim()){toast('Paste the email you received first.');$('#aiIn')&&$('#aiIn').focus();return;}
    const c=tplC(t,m.lang),v=mailValues(),p=proj(m.projectId)||{};
    m.busy=true;render();
    const prompt=`You are helping a project manager reply to an email they received.\n\nWrite the reply in ${m.lang==='es'?'Spanish (Spain)':'English'}. Use the template below as the base: keep its structure, tone, greeting style and sign-off, and adapt the content so it answers the received email. Keep it concise and professional. Where a {{placeholder}} can't be filled from the information given, write it as [placeholder name] so the user can fill it in. Do not invent facts, dates, prices or commitments.\n\nContext:\n- Project: ${p.name||'(none)'}${p.code?' ('+p.code+')':''}\n- Client: ${p.client||'(unknown)'}\n- Client contact: ${p.contactName||'(unknown)'}\n- Sender: ${settings().name||'(unknown)'}\n\nTemplate subject (values already filled where known):\n${fillText(c.subject,v)}\n\nTemplate body (values already filled where known):\n"""\n${fillText(c.body,v)}\n"""\n\nReceived email:\n"""\n${m.incoming}\n"""\n\nExtra instructions from the user: ${m.notes.trim()||'(none)'}\n\nReply with only a JSON object like {"subject": "...", "body": "..."}. Use \\n for line breaks in the body.`;
    try{const r=await caps.sample.json(prompt);if(!r||typeof r.body!=='string')throw{code:'invalid_json'};m.ai={subject:String(r.subject||fillText(c.subject,v)),body:r.body};}
    catch(e){toast(aiErr(e));}
    finally{m.busy=false;render();}
  },
  'backup-export':()=>{
    saveFile(`valleverde-pm-backup-${todayYmd()}.json`,JSON.stringify({app:'valleverde-pm',appVersion:APP_VERSION,version:1,exportedAt:new Date().toISOString(),data:D},null,1),'Backup copied to the clipboard. Paste it into a .json file to keep it.');
  },
  'sug-open':()=>{ui.mail.mode='suggest';render();const c=$('.composer');if(c&&innerWidth<=860)c.scrollIntoView({block:'start'});else window.scrollTo(0,0);},
  'sug-close':()=>{ui.mail.mode='compose';render();},
  'sug-kind':el=>{ui.mail.sug.kind=el.dataset.k;render();if(el.dataset.k==='custom'){const i=$('#sugCustom');if(i)i.focus();}},
  'sug-opt':el=>{ui.mail.sug[el.dataset.o]=el.dataset.v;render();},
  'sug-lang':el=>{ui.mail.sug.lang=el.dataset.lang;render();},
  'sug-gen':()=>genTemplate(false),
  'sug-again':()=>genTemplate(true),
  'sug-discard':()=>{ui.mail.sug.draft=null;render();},
  'sug-ideas':()=>genIdeas(),
  'sug-idea':el=>{const s=ui.mail.sug,i=s.ideas&&s.ideas[+el.dataset.i];if(!i)return;Object.assign(s,{kind:i.kind,custom:'',projectId:i.projectId||'',context:i.context||i.title});genTemplate(false);},
  'sug-use':el=>openTpl(el.dataset.id,el.dataset.p),
  'sug-save':async()=>{
    const s=ui.mail.sug,d=s.draft;if(!d)return;
    const saved=await Store.put('templates',{name:uniqueName(d.name),category:d.category,en:d.en,es:d.es,source:'claude',createdAt:Date.now()});
    s.draft=null;openTpl(saved.id,s.projectId);toast('Template saved. Fill in the fields to use it.');
  },
  'sug-edit':()=>{const d=ui.mail.sug.draft;if(d)tplDialog(null,{...d,name:uniqueName(d.name)});},
  'ai-copy':()=>{const a=ui.mail.ai;if(a)copyText(`Subject: ${a.subject}\n\n${a.body}`,'Reply copied');},
  'ai-log':()=>{const a=ui.mail.ai;if(a)logDialog(null,{type:'email',projectId:ui.mail.projectId,title:a.subject,body:`To: ${ui.mail.to||'(not set)'}\n\n${a.body}`});}
};
const C={
  'goal-done':async el=>{const g=findIn('goals',el.dataset.id);if(g)await Store.put('goals',{...g,status:el.checked?'done':(g.status==='done'?'todo':g.status)});},
  'goal-status':async el=>{const g=findIn('goals',el.dataset.id);if(g)await Store.put('goals',{...g,status:el.value});},
  'mail-proj':el=>{
    const m=ui.mail,prev=proj(m.projectId),p=proj(el.value);
    m.projectId=el.value;
    if(!m.to||(prev&&m.to===prev.contactEmail))m.to=(p&&p.contactEmail)||'';
    const t=curTpl();if(p&&t&&tplLangs(t).includes(p.lang))m.lang=p.lang;
    render();
  },
  'sug-proj':el=>{ui.mail.sug.projectId=el.value;},
  'ts-date':el=>{if(el.value){ui.tsDay=el.value;render();}},
  'backup-import':async el=>{
    const file=el.files&&el.files[0];if(!file)return;
    let o;try{o=JSON.parse(await file.text());}catch{toast('That file isn’t a Valleverde PM backup.');el.value='';return;}
    const src=o&&o.data&&typeof o.data==='object'?o.data:o;let n=0;
    toast('Restoring backup…');
    for(const c of COLLS){if(!Array.isArray(src[c]))continue;for(const item of src[c]){if(item&&typeof item==='object'&&typeof item.id==='string'&&/^[A-Za-z0-9_.~:@+-]{1,200}$/.test(item.id)){await Store.put(c,item);n++;}}}
    el.value='';toast(n?`Restored ${n} item${n===1?'':'s'}`:'No entries found in that file.');
  },
  'diary-f':el=>{ui.diary[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;render();}
};
const I={
  'tpl-q':el=>{ui.mail.q=el.value;render();},
  'mf':el=>{ui.mail.fields[el.dataset.name]=el.value;updateMailPreview();},
  'mail-to':el=>{ui.mail.to=el.value;updateMailPreview();const a=$('#aiLink');if(a&&ui.mail.ai)a.href=mailto(ui.mail.to,ui.mail.ai.subject,ui.mail.ai.body);},
  'ai-in':el=>{ui.mail.incoming=el.value;},
  'sug-custom':el=>{const s=ui.mail.sug;s.custom=el.value;const b=$('[data-act="sug-gen"]');if(b&&!s.busy)b.disabled=!el.value.trim();},
  'sug-ctx':el=>{ui.mail.sug.context=el.value;},
  'ai-notes':el=>{ui.mail.notes=el.value;},
  'ai-subj':el=>{ui.mail.ai.subject=el.value;$('#aiLink').href=mailto(ui.mail.to,ui.mail.ai.subject,ui.mail.ai.body);},
  'ai-body':el=>{ui.mail.ai.body=el.value;$('#aiLink').href=mailto(ui.mail.to,ui.mail.ai.subject,ui.mail.ai.body);},
  'diary-q':el=>{ui.diary.q=el.value;render();},
  'week-notes':el=>{ui.weekDraft[ui.week]=el.value;const b=$('[data-act="week-save"]');if(b)b.disabled=el.value===((D.weeks.find(w=>w.id===ui.week)||{}).notes||'');}
};
const S={
  'timer-start':async(fd,form)=>{
    const run=D.time.find(x=>x.running);
    if(run)await Store.put('time',{...run,running:false,hours:Math.max(0.01,round2((Date.now()-run.startedAt)/36e5))});
    form.reset();
    await Store.put('time',{date:todayYmd(),projectId:fd.projectId,task:(fd.task||'').trim(),description:'',hours:0,billable:true,running:true,startedAt:Date.now(),createdAt:Date.now()});
    toast('Timer started');
  },
  'goal-add':async(fd,form)=>{
    if(!fd.text.trim())return;
    form.elements.text.value='';
    await Store.put('goals',{text:fd.text.trim(),projectId:fd.projectId,status:'todo',week:ui.week,notes:'',createdAt:Date.now()});
  },
  'time-add':async(fd,form)=>{
    const h=parseHours(fd.hours);
    if(!(h>0&&h<=24)){fieldError(form,'hours','Enter hours like 1:30 or 1.5');return;}
    form.elements.hours.value='';form.elements.task.value='';form.elements.description.value='';
    await Store.put('time',{date:ui.tsDay,projectId:fd.projectId,task:(fd.task||'').trim(),description:(fd.description||'').trim(),hours:round2(h),billable:fd.billable==='on',createdAt:Date.now()});
    toast(`Logged ${fmtHM(h)}`);
  },
  'settings-save':async(fd,form)=>{
    const tgt=parseHours(fd.target);
    if(!(tgt>0&&tgt<=24)){fieldError(form,'target','Enter a daily target like 8 or 7:30');return;}
    await Store.put('meta',{...(D.meta.find(m=>m.id==='settings')||{}),id:'settings',name:fd.name.trim(),signature:fd.signature,target:round2(tgt),lang:fd.lang});
    toast('Details saved');
  }
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(fn){if(el.tagName==='BUTTON'&&el.type==='submit')e.preventDefault();fn(el,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&C[el.dataset.change])C[el.dataset.change](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&I[el.dataset.input])I[el.dataset.input](el,e);});
document.addEventListener('toggle',e=>{if(e.target.id==='aiBox')ui.mail.aiOpen=e.target.open;},true);
document.addEventListener('submit',async e=>{
  const form=e.target;
  if(form.id==='dlgForm'){
    e.preventDefault();
    const invalid=[...form.elements].find(x=>x.required&&!String(x.value).trim());
    if(invalid){invalid.setCustomValidity('Fill in this field');invalid.reportValidity();invalid.addEventListener('input',()=>invalid.setCustomValidity(''),{once:true});return;}
    const fd=Object.fromEntries(new FormData(form));
    const btn=form.querySelector('button[type="submit"]');btn.disabled=true;
    try{const ok=await dlgState.onSubmit(fd,form);if(ok!==false)dlg.close();}finally{btn.disabled=false;}
    return;
  }
  const k=form.dataset.submit;
  if(k&&S[k]){e.preventDefault();await S[k](Object.fromEntries(new FormData(form)),form);}
});

function route(){const h=location.hash.slice(1);const v=VIEWS[h]?h:'today';const changed=v!==ui.view;ui.view=v;render();if(changed)window.scrollTo(0,0);}
addEventListener('hashchange',route);
ui.view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'today';
render();
Store.init();
</script>
</body>
</html>
