[package]
name = "valleverde-pm"
version = "0.3.0"
description = "A local desktop planner for project managers"
authors = ["Karlos Valverde"]
edition = "2021"

[lib]
name = "valleverde_pm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
