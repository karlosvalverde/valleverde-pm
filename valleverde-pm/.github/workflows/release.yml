name: Release

# Runs when you push a version tag, e.g. git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($PKG)"; exit 1
          fi
      - run: npm run check
      - run: npm run build
      - run: node tools/release-notes.js "$GITHUB_REF_NAME" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "Valleverde PM $GITHUB_REF_NAME" --notes-file notes.md
