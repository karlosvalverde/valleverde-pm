# Builds the macOS app when you push a version tag (for example v0.2.0)
# and attaches it to a draft GitHub release. The app is ad-hoc signed, not notarized.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Valleverde PM ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for what changed. The app isn’t notarized by Apple: the first time you open it, go to System Settings, then Privacy & Security, and choose Open Anyway.'
          releaseDraft: true
          args: --target universal-apple-darwin
